<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="auto">
  <defs>
    <!-- Gradient for the circle background -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e4de;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow for cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="300" cy="300" r="220" fill="url(#circleGrad)" stroke="#e0dcd6" stroke-width="2"/>

  <!-- Center title -->
  <text x="300" y="285" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="18" font-weight="700" fill="#1a2a4a">
    Doctoral Seminar
  </text>
  <text x="300" y="310" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="18" font-weight="700" fill="#1a2a4a">
    Workshop Sequence
  </text>
  <text x="300" y="335" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="12" fill="#5a5a5a">
    4-Phase Cycle
  </text>

  <!-- Phase 1: Writing Your First Article (Top) -->
  <g transform="translate(300, 80)">
    <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#fff" stroke="#1a5fb4" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#1a5fb4">Writing Your</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#1a5fb4">First Article</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="10" fill="#5a5a5a">Phase 1 • Fall</text>
  </g>

  <!-- Arrow: Phase 1 → Phase 2 (Top-right) -->
  <path d="M 380 110 Q 450 150 480 220" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 2: Writing For Funding (Right) -->
  <g transform="translate(520, 300)">
    <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#fff" stroke="#2a7a2a" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#2a7a2a">Writing For</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#2a7a2a">Funding</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="10" fill="#5a5a5a">Phase 2 • Fall</text>
  </g>

  <!-- Arrow: Phase 2 → Phase 3 (Bottom-right) -->
  <path d="M 480 380 Q 450 450 380 490" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 3: Writing Your Dissertation Proposal (Bottom) -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#fff" stroke="#c75b2a" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#c75b2a">Writing Your</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#c75b2a">Dissertation Proposal</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="10" fill="#5a5a5a">Phase 3 • Spring</text>
  </g>

  <!-- Arrow: Phase 3 → Phase 4 (Bottom-left) -->
  <path d="M 220 490 Q 150 450 120 380" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 4: Developing Your Academic Brand (Left) -->
  <g transform="translate(80, 300)">
    <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#fff" stroke="#6b3a8a" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="13" font-weight="600" fill="#6b3a8a">Developing Your</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="13" font-weight="600" fill="#6b3a8a">Academic Brand</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="10" fill="#5a5a5a">Phase 4 • Spring</text>
  </g>

  <!-- Arrow: Phase 4 → Phase 1 (Top-left) -->
  <path d="M 120 220 Q 150 150 220 110" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a4a"/>
    </marker>
  </defs>

  <!-- Current phase indicator (Fall 2026 = Phase 1) -->
  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#c75b2a" stroke-width="3" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="55" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="11" font-weight="600" fill="#c75b2a">CURRENT</text>
  </g>
</svg>