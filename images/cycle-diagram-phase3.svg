    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#1a5fb4">Writing Your</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#1a5fb4">First Article</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="10" fill="#5a5a5a">Phase 1 &#183; Fall</text>
  </g>
  <g transform="translate(605, 310)">
