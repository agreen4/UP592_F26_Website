<svg xmlns="http://www.w3.org/2000/svg" viewBox="-78 57 816 539" width="100%" height="auto" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Doctoral Seminar Workshop Sequence &#8212; four-phase cycle</title>
  <desc id="cycle-desc">Four-phase doctoral seminar cycle: Phase 1 Writing Your First Article; Phase 2 Writing For Funding; Phase 3 Writing Your Dissertation Proposal; Phase 4 Developing Your Academic Brand. Phase 3, Writing Your Dissertation Proposal, is the current semester.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a4a"/>
    </marker>
  </defs>
  <text x="330" y="285" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="18" font-weight="700" fill="#1a2a4a">Doctoral Seminar</text>
  <text x="330" y="310" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="18" font-weight="700" fill="#1a2a4a">Workshop Sequence</text>
  <text x="330" y="335" text-anchor="middle" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="12" fill="#5a5a5a">4-Phase Cycle</text>
  <path d="M 467.4 88.0 A 325 245 0 0 1 624.6 206.5" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M 624.6 413.5 A 325 245 0 0 1 467.4 532.0" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M 192.6 532.0 A 325 245 0 0 1 35.4 413.5" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M 35.4 206.5 A 325 245 0 0 1 192.6 88.0" fill="none" stroke="#1a2a4a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <g transform="translate(330, 115)">
