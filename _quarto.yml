project:
  type: website
  output-dir: _site
  # Render only the site pages. Without this, Quarto sweeps up every .md in the
  # repo root — CLAUDE.md was being built into a public CLAUDE.html page and
  # indexed in search.json.
  render:
    - "*.qmd"

website:
  title: "UP 592: Doctoral Seminar"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.qmd
        text: Schedule
      - href: resources.qmd
        text: Resources
    right:
      - text: "Fall 2026"
        href: schedule.qmd#fall-2026
      - text: "Spring 2027"
        href: schedule.qmd#spring-2027
  page-footer:
    left: "UP 592: Doctoral Seminar"
    center: "University of Illinois at Urbana-Champaign"
    right: "Department of Urban & Regional Planning"
  search: 
    location: navbar
    type: textbox

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    css: styles.css

execute:
  freeze: auto
