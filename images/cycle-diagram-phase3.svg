    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#2a7a2a">Writing For</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="14" font-weight="600" fill="#2a7a2a">Funding</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="10" fill="#5a5a5a">Phase 2 &#183; Fall</text>
  </g>
  <g transform="translate(330, 505)">
    <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#fff" stroke="#c75b2a" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="13" font-weight="600" fill="#c75b2a">Writing Your</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif" font-size="13" font-weight="600" fill="#c75b2a">Dissertation Proposal</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="10" fill="#5a5a5a">Phase 3 &#183; Spring</text>
    <rect x="-119" y="-44" width="238" height="88" rx="12" fill="none" stroke="#c75b2a" stroke-width="3" stroke-dasharray="5,3"></rect>
    <text x="0" y="65" text-anchor="middle" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#c75b2a">CURRENT</text>
